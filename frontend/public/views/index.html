<!DOCTYPE html>
<html lang="es">

    <head>
        <script src="https://kit.fontawesome.com/a5d52be292.js"
            crossorigin="anonymous"></script>
        <script src="../js/includes.js"></script>
        <script src="../js/index.js"></script>
        <script src="../js/nav-bar.js"></script>
        <title>ViajAR</title>
    </head>

    <body>
        <!--===========Nav Bar=================-->
        <section class="nav-bar" id="nav-bar-container">
        </section>
        <!--===============Banner================-->
        <section class="banner">
            <div class="sky">
                <img class="plane" src="./img/VUELOS.png" alt>
            </div>
            <div class="banner-text-item">
                <div class="banner-heading">
                    <h1>Encuentra tu Próxima Aventura</h1>
                </div>
                <form class="form">
                    <input type="text" list="mylist"
                        placeholder="¿A donde quieres ir?">
                    <datalist id="mylist">
                        <option>Cataratas del Iguazú</option>
                        <option>Bariloche</option>
                        <option>Glaciar Perito Moreno</option>
                        <option>C.A.B.A</option>
                        <option>Andes</option>
                        <option>Mar del Plata</option>
                        <option>Otro</option>
                    </datalist>
                    <!-- <input type="date" class="date"> -->
                    <a href="#" class="book">Ir</a>
                </form>
            </div>
        </section>

        <!--==============Places===================-->
        <section class="places">
            <div class="places-text">
                <!-- <small>Paquetes Turisticos</small> -->
                <h2>Paquetes Especiales</h2>
            </div>

            <div class="cards">
                <div id="paquetesContainer" class="paquetes-container">
                    <!-- Aquí se insertarán las tarjetas de paquetes -->
                </div>
            </div>
        </section>

        <!--===========Footer=================-->
        <footer class="footer">
            <div class=" links">
                <h3>Enlaces</h3>
                <ul>
                    <li> <a href="./contacto.html" class> Contáctanos</a></li>
                    <li><a href="./nosotros.html">Nosotros</a></li>
                </ul>
            </div>

        </footer>

        <script src="https://kit.fontawesome.com/a5d52be292.js"
            crossorigin="anonymous"></script>
        <script
            src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <script
            src="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="../js/index.js" async defer></script>
    </body>
</html>
