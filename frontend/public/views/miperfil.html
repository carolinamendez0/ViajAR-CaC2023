<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- GOOGLE FONTS -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&family=Quicksand&display=swap"
            rel="stylesheet">
        <script src="https://kit.fontawesome.com/a5d52be292.js"
            crossorigin="anonymous"></script>
        <!-- BOOTSTRAP  -->
        <link
            href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
            rel="stylesheet" id="bootstrap-css">
        <script
            src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <script
            src="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

        <!-- DataTables CSS -->
        <link rel="stylesheet" type="text/css"
            href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">

        <!-- DataTables JS -->
        <script type="text/javascript" charset="utf8"
            src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
            <script
            src="https://cdn.jsdelivr.net/jquery.validation/1.15.1/jquery.validate.min.js"></script>
        <!-- NAV-BAR  -->
        <script src="../js/nav-bar.js"></script>
        <!-- ESTILO GLOBAL CSS -->
        <link rel="stylesheet" type="text/css" href="./css/style.css">
        <!-- ESTILO PROPIO CSS -->
        <link rel="stylesheet" type="text/css" href="./css/miperfil.css">
        <!-- axios para poder usarlo en el await axios del js -->
             <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <!-- JAVS SCRIPT PROPIO  -->
        <script src="../js/miperfil.js"></script>
        <script src="../js/crudUsuario.js"></script>
        <script src="../js/popUp.js"></script>
        <script src="../js/crudPaquetes.js"></script>
        <script src="../js/crudDestinos.js"></script>


        <!-- TITULO  -->
        <title>ViajAR</title>
        <style>
        .tab-content .tab-pane {
            padding-top: 20px;
        }
    </style>
    </head>
    <body>
       <!--===========Nav Bar=================-->
        <section class="nav-bar" id="nav-bar-container">
        </section>
        <!-- ANIMACION FONDO  -->
        <section class="area">
                    <ul class="circles">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li><li></li></li>
                        <li><li></li></li>
                    </ul>
            <div class="container py-5">
                <div class="row">
                            <div class="col">
                                <nav aria-label="breadcrumb"
                                    class="bg-body-tertiary rounded-3 mb-4">
                                    <ol class="breadcrumb mb-0">
                                        <li class="breadcrumb-item active"
                                            aria-current="page">Perfil</li>
                                    </ol>
                                </nav>
                            </div>
                        </div>
                        <div class="row">
                <div class="col-lg-12">
                                <div class="card mb-4">
                                    <div class="card-body">
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">Nombre</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text" id="nombre"
                                                    class="form-control col-sm-3"
                                                    value>
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">Apellido</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text"
                                                    class="form-control col-sm-3"
                                                    id="apellido" value>
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">Dni</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text"
                                                    class="form-control col-sm-3"
                                                    id="dni" value>
                                                    <div id="dni-error"
                                                    class="error" style="color: red;"></div>
                                                </div>
                                            </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">Email</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text"
                                                    class="form-control col-sm-3"
                                                    id="email" value>
                                                    <div id="email-error"
                                            class="error" style="color: red;"></div>
                                            </div>
                                            
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">Contraseña nueva</h6>
                                            </div>
                                            <div class="col-sm-3 text-secondary">
                                                <input type="password" name="password"
                                                    class="form-control password1 col-sm-8"
                                                    id="nueva-contraseña" /><span
                                                    class="fa fa-fw fa-eye col-sm-6 password-icon show-password"></span>
                                            </div>
                                        </div>
                                       
                                        <div class="row">
                                            <div class="col-sm-3"></div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="button"
                                                    class="btn btn-primary px-4"
                                                    value="Save Changes"
                                                    onclick="updateUsuario()">
                                            </div>
                                        </div>
                                        <br>
                                        <hr>
                                        <br>
                                        <div id="boletoTableContainer"
                                                            >
                                                            <table id="boletosTable"
                                                                class="hover">
                                                                <thead>
                                                                    <tr>
                                                                        <th>Paquete</th>
                                                                        <th>Destino</th>
                                                                        <th>Descripción de paquete</th>
                                                                        <th>Valor</th>
                                                                        <th>Fecha</th>
                                                                        <th>Tickets</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                </tbody>
                                                            </table>
                                        </div>
                                    </div>
                                </div>
                    <!-- VISTA ADMIN  -->
                        <div class="row" id="vistaAdmin" style="display: none;">
                            <div class="col-md-12">
                                <div class="card mb-4 mb-md-0">
                                    <div class="card-body">
                                        <ul class="nav nav-tabs" id="myTab"
                                                    role="tablist">
                                                    <li class="nav-item"
                                                        role="presentation">
                                                        <a class="nav-link active"
                                                            id="usuarios-tab"
                                                            data-toggle="tab"
                                                            href="#usuarios" role="tab"
                                                            aria-controls="usuarios"
                                                            aria-selected="true">Usuarios</a>
                                                    </li>
                                                 <!-- TAB DE Comentarios  -->
                                                    <li class="nav-item"
                                                        role="presentation">
                                                        <a class="nav-link"
                                                            id="comentarios-tab"
                                                            data-toggle="tab"
                                                            href="#comentarios"
                                                            role="tab"
                                                            aria-controls="comentarios"
                                                            aria-selected="false">Comentarios</a>
                                                    </li>
                                                 <!-- TAB DE PAQUETES  -->
                                                    <li class="nav-item"
                                                        role="presentation">
                                                        <a class="nav-link"
                                                            id="paquetes-tab"
                                                            data-toggle="tab"
                                                            href="#paquetes"
                                                            role="tab"
                                                            aria-controls="paquetes"
                                                            aria-selected="false">PAQUETES</a>
                                                    </li>
                                                 <!-- TAB DE DESTINOS  -->
                                                    <li class="nav-item"
                                                        role="presentation">
                                                        <a class="nav-link"
                                                            id="destinos-tab"
                                                            data-toggle="tab"
                                                            href="#destinos"
                                                            role="tab"
                                                            aria-controls="destinos"
                                                            aria-selected="false">DESTINOS</a>
                                                    </li>
                                                </ul>
                                        <!-- Tab Pane - Usuarios -->
                                            <div class="tab-pane fade show active" id="usuarios" role="tabpanel" aria-labelledby="usuarios-tab">
                                                <div id="usuariosView"></div>
                                            </div>

                                            <!-- Tab Pane - Comentarios -->
                                            <div class="tab-pane fade" id="comentarios" role="tabpanel" aria-labelledby="comentarios-tab">
                                                <div id="comentView"></div>
                                            </div>

                                            <!-- Tab Pane - Paquetes -->
                                            <div class="tab-pane fade" id="paquetes" role="tabpanel" aria-labelledby="paquetes-tab">
                                                <div id="paquetesView"></div>
                                            </div>

                                            <!-- Tab Pane - Destinos -->
                                            <div class="tab-pane fade" id="destinos" role="tabpanel" aria-labelledby="destinos-tab">
                                                <div id="destinosView"></div>
                                            </div>

                                    </div>
                                </div>
                            </div>
                        </div> <!-- DIV VISTA ADMIN -->
                </div>
                </div>
            </div>
        </div>
        </section>
    </body>
</html>
